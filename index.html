    /* ==========================================================================
       CAMADA DE API / SUPABASE COM FALLBACK INTELIGENTE (MODO HÍBRIDO)
    ========================================================================== */
    function getSupabaseConfig() {
      try {
        const saved = localStorage.getItem(STORAGE_KEYS.CONFIG);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return {
        url: DEFAULT_SUPABASE_URL,
        key: DEFAULT_SUPABASE_KEY,
        useLocal: localStorage.getItem(STORAGE_KEYS.USE_LOCAL) === "true",
      };
    }

    function saveSupabaseConfig(cfg) {
      localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(cfg));
      localStorage.setItem(STORAGE_KEYS.USE_LOCAL, cfg.useLocal ? "true" : "false");
    }

    async function supabaseRest(path, { method = "GET", body, accessToken } = {}) {
      const cfg = getSupabaseConfig();
      if (cfg.useLocal) {
        throw new Error("Modo local ativo.");
      }

      const headers = {
        apikey: cfg.key,
        Authorization: `Bearer ${accessToken || cfg.key}`,
        "Content-Type": "application/json",
      };
      if (method !== "GET") headers["Prefer"] = "return=representation";

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000); // 6s timeout

      try {
        const res = await fetch(`${cfg.url}/rest/v1/${path}`, {
          method,
          headers,
          body: body !== undefined ? JSON.stringify(body) : undefined,
          signal: controller.signal,
        });
        clearTimeout(timeoutId);
        const data = await res.json().catch(() => null);
        if (!res.ok) {
          throw new Error((data && (data.message || data.error_description)) || "Erro de conexão com o banco de dados.");
        }
        return data;
      } catch (err) {
        clearTimeout(timeoutId);
        throw err;
      }
    }

    async function supabaseSignIn(email, password) {
      const cfg = getSupabaseConfig();
      if (cfg.useLocal) {
        // Modo local: aceita qualquer email ou admin demo
        if (email && password) {
          return {
            access_token: "demo_token_" + Date.now(),
            user: { email: email },
            expires_at: Math.floor(Date.now() / 1000) + 86400,
          };
        }
      }

      const res = await fetch(`${cfg.url}/auth/v1/token?grant_type=password`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: cfg.key },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error_description || data.msg || "E-mail ou senha incorretos.");
      }
      return data;
    }

    // Mapeamento de entidades
    function dbToProduct(row) {
      return {
        id: String(row.id),
        name: row.name,
        category: row.category,
        aroma: row.aroma || "",
        size: row.size || "",
        usage: row.usage_notes || "",
        price: parseFloat(row.price) || 0,
        active: row.active !== false,
        photos: Array.isArray(row.photos) ? row.photos : (row.photos ? [row.photos] : []),
        mainPhoto: row.main_photo || 0,
      };
    }

    function productToDb(p) {
      return {
        name: p.name,
        category: p.category,
        aroma: p.aroma,
        size: p.size,
        usage_notes: p.usage,
        price: p.price,
        active: p.active,
        photos: p.photos,
        main_photo: p.mainPhoto,
      };
    }

    function dbToReservation(row) {
      return {
        id: String(row.id),
        name: row.customer_name,
        whatsapp: row.customer_whatsapp,
        items: row.items || [],
        total: parseFloat(row.total) || 0,
        giftWrap: row.gift_wrap === true,
        packages: row.packages || [],
        status: row.status || "pendente",
        notes: row.notes || "",
        createdAt: row.created_at || new Date().toISOString(),
      };
    }

    function reservationToDb(r) {
      return {
        customer_name: r.name,
        customer_whatsapp: r.whatsapp,
        items: r.items,
        total: r.total,
        gift_wrap: r.giftWrap,
        packages: r.packages,
        status: r.status || "pendente",
        notes: r.notes || "",
      };
    }

    function ToastContainer({ toasts, removeToast }) {
      return (
        <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4">
          {toasts.map((t) => (
            <div
              key={t.id}
              className={`pointer-events-auto p-4 rounded border shadow-xl flex items-start gap-3 animate-fade-in ${
                t.type === "error"
                  ? "bg-red-950/90 border-red-800 text-red-100"
                  : t.type === "success"
                  ? "bg-emerald-950/90 border-emerald-800 text-emerald-100"
                  : "bg-brand-surface2/95 border-brand-accent text-brand-text"
              }`}
            >
              <div className="mt-0.5">
                {t.type === "error" ? (
                  <span className="text-red-400 font-bold">!</span>
                ) : (
                  <Icon name="check" size={16} className="text-brand-accent" />
                )}
              </div>
              <div className="flex-1 text-sm font-medium">{t.message}</div>
              <button
                onClick={() => removeToast(t.id)}
                className="text-brand-muted hover:text-white"
              >
                <Icon name="x" size={14} />
              </button>
            </div>
          ))}
        </div>
      );
    }

      /* -------------------------------------------------------------
         CARREGAMENTO INICIAL DO CATÁLOGO
      ------------------------------------------------------------- */
      async function loadCatalog() {
        setCatalogLoading(true);
        const cfg = getSupabaseConfig();

        if (cfg.useLocal) {
          useLocalCatalog();
          setCatalogLoading(false);
          return;
        }

        try {
          const [prodRows, catRows] = await Promise.all([
            supabaseRest("products?select=*&order=created_at.asc"),
            supabaseRest("categories?select=name&order=created_at.asc"),
          ]);
          if (prodRows && prodRows.length > 0) {
            setProducts(prodRows.map(dbToProduct));
            localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(prodRows.map(dbToProduct)));
          } else {
            useLocalCatalog();
          }

          if (catRows && catRows.length > 0) {
            setCategories(catRows.map((c) => c.name));
            localStorage.setItem(STORAGE_KEYS.CATEGORIES, JSON.stringify(catRows.map((c) => c.name)));
          } else {
            setCategories(SEED_CATEGORIES);
          }
          setIsUsingLocalData(false);
        } catch (err) {
          console.warn("Supabase indisponível no momento, usando modo local/cache:", err.message);
          useLocalCatalog();
          setIsUsingLocalData(true);
        } finally {
          setCatalogLoading(false);
        }
      }

      function useLocalCatalog() {
        const cachedProd = localStorage.getItem(STORAGE_KEYS.PRODUCTS);
        const cachedCat = localStorage.getItem(STORAGE_KEYS.CATEGORIES);

        if (cachedProd) {
          setProducts(JSON.parse(cachedProd));
        } else {
          setProducts(SEED_PRODUCTS);
          localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(SEED_PRODUCTS));
        }

        if (cachedCat) {
          setCategories(JSON.parse(cachedCat));
        } else {
          setCategories(SEED_CATEGORIES);
          localStorage.setItem(STORAGE_KEYS.CATEGORIES, JSON.stringify(SEED_CATEGORIES));
        }
      }

      // Restaura sessão do Administrador
      useEffect(() => {
        loadCatalog();
        try {
          const savedSession = localStorage.getItem(STORAGE_KEYS.SESSION);
          if (savedSession) {
            const parsed = JSON.parse(savedSession);
            if (parsed.expires_at && parsed.expires_at * 1000 > Date.now()) {
              setSession(parsed);
            } else {
              localStorage.removeItem(STORAGE_KEYS.SESSION);
            }
          }
        } catch (e) {}
      }, []);

      // Carrega reservas quando autenticado como admin
      async function loadReservations() {
        setReservationsLoading(true);
        const cfg = getSupabaseConfig();
        if (cfg.useLocal || isUsingLocalData) {
          const localRes = localStorage.getItem(STORAGE_KEYS.RESERVATIONS);
          setReservations(localRes ? JSON.parse(localRes) : []);
          setReservationsLoading(false);
          return;
        }

        try {
          const rows = await supabaseRest("reservations?select=*&order=created_at.desc", {
            accessToken: session?.access_token,
          });
          setReservations(rows.map(dbToReservation));
        } catch (err) {
          // Fallback para reservas salvas no localStorage
          const localRes = localStorage.getItem(STORAGE_KEYS.RESERVATIONS);
          setReservations(localRes ? JSON.parse(localRes) : []);
        } finally {
          setReservationsLoading(false);
        }
      }

      useEffect(() => {
        if (session) {
          loadReservations();
        }
      }, [session, isUsingLocalData]);

      /* -------------------------------------------------------------
         CARRINHO E CÁLCULOS
      ------------------------------------------------------------- */
      const activeProducts = useMemo(() => products.filter((p) => p.active), [products]);
      const productById = (id) => products.find((p) => p.id === id);

      const cartLines = useMemo(() => {
        return cart
          .map((c) => ({ ...c, product: productById(c.productId) }))
          .filter((c) => c.product);
      }, [cart, products]);

      const totalItems = useMemo(() => cartLines.reduce((s, c) => s + c.qty, 0), [cartLines]);
      const totalValue = useMemo(
        () => cartLines.reduce((s, c) => s + c.qty * c.product.price, 0),
        [cartLines]
      );

      function addToCart(productId) {
        setCart((prev) => {
          const found = prev.find((c) => c.productId === productId);
          if (found) {
            return prev.map((c) => (c.productId === productId ? { ...c, qty: c.qty + 1 } : c));
          }
          return [...prev, { productId, qty: 1 }];
        });
        const p = productById(productId);
        addToast(`Adicionado: ${p ? p.name : "Produto"}`, "success");
      }

      function changeQty(productId, delta) {
        setCart((prev) =>
          prev
            .map((c) => (c.productId === productId ? { ...c, qty: c.qty + delta } : c))
            .filter((c) => c.qty > 0)
        );
      }

      function removeFromCart(productId) {
        setCart((prev) => prev.filter((c) => c.productId !== productId));
      }

      /* -------------------------------------------------------------
         LÓGICA DE EMBALAGENS DE PRESENTE
      ------------------------------------------------------------- */
      function allocatedFor(productId) {
        return packages.reduce((s, pkg) => s + (pkg.items[productId] || 0), 0);
      }

      function remainingFor(productId, cartQty) {
        return cartQty - allocatedFor(productId);
      }

      const totalUsedInPackages = useMemo(() => {
        return packages.reduce(
          (s, pkg) => s + Object.values(pkg.items).reduce((a, b) => a + b, 0),
          0
        );
      }, [packages]);

      function addPackage() {
        if (packages.length >= totalItems) return;
        setPackages((prev) => [...prev, { id: uid(), items: {} }]);
      }

      function removePackage(pkgId) {
        setPackages((prev) => prev.filter((p) => p.id !== pkgId));
      }

      function adjustPackageItem(pkgId, productId, delta, cartQty) {
        setPackages((prev) =>
          prev.map((pkg) => {
            if (pkg.id !== pkgId) return pkg;
            const current = pkg.items[productId] || 0;
            const next = current + delta;
            if (next < 0) return pkg;
            if (delta > 0 && remainingFor(productId, cartQty) <= 0) return pkg;
            const items = { ...pkg.items, [productId]: next };
            if (next === 0) delete items[productId];
            return { ...pkg, items };
          })
        );
      }

      /* -------------------------------------------------------------
         FINALIZAÇÃO DA RESERVA
      ------------------------------------------------------------- */
      async function confirmReservation() {
        if (!customerName.trim() || !customerWhatsapp.trim()) {
          addToast("Por favor, preencha seu nome e WhatsApp.", "error");
          return;
        }

        const items = cartLines.map((c) => ({
          productId: c.product.id,
          name: c.product.name,
          category: c.product.category,
          aroma: c.product.aroma,
          size: c.product.size,
          price: c.product.price,
          qty: c.qty,
        }));

        const cleanPackages =
          giftWrap === true
            ? packages
                .filter((p) => Object.keys(p.items).length > 0)
                .map((p) => ({
                  id: p.id,
                  items: Object.entries(p.items).map(([pId, qty]) => ({
                    productId: pId,
                    name: productById(pId)?.name || "Produto",
                    qty,
                  })),
                }))
            : [];

        const reservation = {
          id: uid(),
          name: customerName.trim(),
          whatsapp: customerWhatsapp.trim(),
          items,
          total: totalValue,
          giftWrap: giftWrap === true,
          packages: cleanPackages,
          notes: customerNotes.trim(),
          status: "pendente",
          createdAt: new Date().toISOString(),
        };

        setConfirmLoading(true);

        try {
          const cfg = getSupabaseConfig();
          if (!cfg.useLocal && !isUsingLocalData) {
            const rows = await supabaseRest("reservations", {
              method: "POST",
              body: [reservationToDb(reservation)],
            });
            if (rows && rows[0]) {
              reservation.id = String(rows[0].id);
            }
          }
        } catch (err) {
          console.warn("Salvando reserva no armazenamento local:", err.message);
        }

        // Salva cópia localmente sempre
        const existingLocal = JSON.parse(localStorage.getItem(STORAGE_KEYS.RESERVATIONS) || "[]");
        localStorage.setItem(
          STORAGE_KEYS.RESERVATIONS,
          JSON.stringify([reservation, ...existingLocal])
        );

        setLastReservation(reservation);
        setView("confirmation");
        setConfirmLoading(false);
      }

      function resetFlow() {
        setCart([]);
        setGiftWrap(null);
        setPackages([]);
        setCustomerName("");
        setCustomerWhatsapp("");
        setCustomerNotes("");
        setLastReservation(null);
        setView("home");
      }

      /* -------------------------------------------------------------
         ADMINISTRAÇÃO DE PRODUTOS E STATUS
      ------------------------------------------------------------- */
      async function handleSaveProduct() {
        if (!productDraft.name.trim() || !productDraft.price) {
          addToast("Informe o nome e o preço do produto.", "error");
          return;
        }

        const priceNum = parseFloat(String(productDraft.price).replace(",", ".")) || 0;
        const toSave = {
          ...productDraft,
          price: priceNum,
          photos:
            productDraft.photos.length > 0
              ? productDraft.photos
              : ["https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=800&q=80"],
        };

        try {
          if (editingProduct) {
            // Atualizar
            setProducts((prev) =>
              prev.map((p) => (p.id === editingProduct.id ? { ...toSave, id: editingProduct.id } : p))
            );
            if (!isUsingLocalData) {
              await supabaseRest(`products?id=eq.${editingProduct.id}`, {
                method: "PATCH",
                body: productToDb(toSave),
                accessToken: session?.access_token,
              });
            }
            addToast("Produto atualizado com sucesso!", "success");
          } else {
            // Criar
            const newProd = { ...toSave, id: uid() };
            setProducts((prev) => [newProd, ...prev]);
            if (!isUsingLocalData) {
              const rows = await supabaseRest("products", {
                method: "POST",
                body: [productToDb(toSave)],
                accessToken: session?.access_token,
              });
              if (rows && rows[0]) {
                newProd.id = String(rows[0].id);
              }
            }
            addToast("Novo produto cadastrado!", "success");
          }

          // Atualiza localStorage
          localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(products));
          setEditingProduct(null);
          setAdminTab("products");
        } catch (err) {
          addToast("Aviso: Salvo no armazenamento local deste dispositivo.", "info");
          localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(products));
          setEditingProduct(null);
          setAdminTab("products");
        }
      }

      async function handleDeleteProduct(id) {
        if (!confirm("Deseja realmente remover este produto?")) return;
        setProducts((prev) => prev.filter((p) => p.id !== id));
        localStorage.setItem(
          STORAGE_KEYS.PRODUCTS,
          JSON.stringify(products.filter((p) => p.id !== id))
        );
        try {
          if (!isUsingLocalData) {
            await supabaseRest(`products?id=eq.${id}`, {
              method: "DELETE",
              accessToken: session?.access_token,
            });
          }
          addToast("Produto removido.", "info");
        } catch (e) {}
      }

      async function handleToggleProductActive(id) {
        const prod = products.find((p) => p.id === id);
        if (!prod) return;
        const nextActive = !prod.active;
        setProducts((prev) =>
          prev.map((p) => (p.id === id ? { ...p, active: nextActive } : p))
        );
        localStorage.setItem(
          STORAGE_KEYS.PRODUCTS,
          JSON.stringify(products.map((p) => (p.id === id ? { ...p, active: nextActive } : p)))
        );

        try {
          if (!isUsingLocalData) {
            await supabaseRest(`products?id=eq.${id}`, {
              method: "PATCH",
              body: { active: nextActive },
              accessToken: session?.access_token,
            });
          }
        } catch (e) {}
      }

      async function handleUpdateReservationStatus(id, newStatus) {
        setReservations((prev) =>
          prev.map((r) => (r.id === id ? { ...r, status: newStatus } : r))
        );
        const local = JSON.parse(localStorage.getItem(STORAGE_KEYS.RESERVATIONS) || "[]");
        localStorage.setItem(
          STORAGE_KEYS.RESERVATIONS,
          JSON.stringify(local.map((r) => (r.id === id ? { ...r, status: newStatus } : r)))
        );
        addToast(`Status alterado para "${newStatus}".`, "success");

        try {
          if (!isUsingLocalData) {
            await supabaseRest(`reservations?id=eq.${id}`, {
              method: "PATCH",
              body: { status: newStatus },
              accessToken: session?.access_token,
            });
          }
        } catch (e) {}
      }

      function handleAddCategory() {
        const cat = newCategoryInput.trim();
        if (!cat || categories.includes(cat)) return;
        const updated = [...categories, cat];
        setCategories(updated);
        localStorage.setItem(STORAGE_KEYS.CATEGORIES, JSON.stringify(updated));
        setProductDraft((d) => ({ ...d, category: cat }));
        setNewCategoryInput("");
        addToast(`Categoria "${cat}" criada.`, "success");
      }

      /* -------------------------------------------------------------
         AGREGAÇÕES DO PAINEL DE CONTROLE
      ------------------------------------------------------------- */
      const uniqueCustomerCount = useMemo(() => {
        return new Set(reservations.map((r) => r.whatsapp)).size;
      }, [reservations]);

      const totalItemsReservedCount = useMemo(() => {
        return reservations.reduce(
          (sum, r) => sum + r.items.reduce((acc, it) => acc + (it.qty || 1), 0),
          0
        );
      }, [reservations]);

      const totalRevenueReserved = useMemo(() => {
        return reservations.reduce((sum, r) => sum + (r.total || 0), 0);
      }, [reservations]);

      const itemAggregation = useMemo(() => {
        const map = {};
        reservations.forEach((r) => {
          if (r.status !== "cancelada") {
            r.items.forEach((it) => {
              const key = it.productId || it.name;
              if (!map[key]) {
                map[key] = {
                  productId: it.productId,
                  name: it.name,
                  aroma: it.aroma || "",
                  size: it.size || "",
                  qty: 0,
                  total: 0,
                };
              }
              map[key].qty += it.qty || 1;
              map[key].total += (it.price || 0) * (it.qty || 1);
            });
          }
        });
        return Object.values(map).sort((a, b) => b.qty - a.qty);
      }, [reservations]);

      /* -------------------------------------------------------------
         EXPORTAR RESERVAS EM CSV
      ------------------------------------------------------------- */
      function exportToCSV() {
        if (reservations.length === 0) {
          addToast("Nenhuma reserva para exportar.", "info");
          return;
        }
        let csv = "ID,Data,Cliente,WhatsApp,Total (R$),Status,Embalagem Presente,Itens\n";
        reservations.forEach((r) => {
          const itemsStr = r.items.map((i) => `${i.qty}x ${i.name}`).join("; ");
          const row = [
            `"${r.id}"`,
            `"${new Date(r.createdAt).toLocaleDateString("pt-BR")}"`,
            `"${r.name.replace(/"/g, '""')}"`,
            `"${r.whatsapp}"`,
            `"${r.total.toFixed(2)}"`,
            `"${r.status}"`,
            `"${r.giftWrap ? "Sim" : "Nao"}"`,
            `"${itemsStr.replace(/"/g, '""')}"`,
          ];
          csv += row.join(",") + "\n";
        });
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `reservas-casa-vellumine-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        addToast("Arquivo CSV gerado com sucesso!", "success");
      }

      return (
        <div className="min-h-screen flex flex-col bg-brand-bg text-brand-text">
          {/* TOASTS */}
          <ToastContainer toasts={toasts} removeToast={removeToast} />

          {/* FLUXO DO CLIENTE */}
          {view === "home" && (
            <HomeScreen
              onStart={() => setView("products")}
              onAdmin={() => setView(session ? "admin" : "adminLogin")}
              totalProducts={activeProducts.length}
            />
          )}

          {view === "products" && (
            <ProductsScreen
              products={activeProducts}
              categories={categories}
              cart={cart}
              totalItems={totalItems}
              totalValue={totalValue}
              onAddToCart={addToCart}
              onBack={() => setView("home")}
              onGoCart={() => setView("cart")}
              onAdmin={() => setView(session ? "admin" : "adminLogin")}
              isUsingLocalData={isUsingLocalData}
            />
          )}

          {view === "cart" && (
            <CartScreen
              cartLines={cartLines}
              totalValue={totalValue}
              onChangeQty={changeQty}
              onRemove={removeFromCart}
              onBack={() => setView("products")}
              onContinue={() => setView("giftwrap")}
            />
          )}

          {view === "giftwrap" && (
            <GiftWrapScreen
              onYes={() => {
                setGiftWrap(true);
                setPackages([{ id: uid(), items: {} }]);
                setView("packages");
              }}
              onNo={() => {
                setGiftWrap(false);
                setPackages([]);
                setView("customer");
              }}
              onBack={() => setView("cart")}
            />
          )}

          {view === "packages" && (
            <PackagesScreen
              cartLines={cartLines}
              packages={packages}
              totalItems={totalItems}
              totalUsed={totalUsedInPackages}
              onAddPackage={addPackage}
              onRemovePackage={removePackage}
              onAdjust={adjustPackageItem}
              remainingFor={remainingFor}
              onBack={() => setView("giftwrap")}
              onContinue={() => setView("customer")}
            />
          )}

          {view === "customer" && (
            <CustomerScreen
              name={customerName}
              setName={setCustomerName}
              whatsapp={customerWhatsapp}
              setWhatsapp={setCustomerWhatsapp}
              notes={customerNotes}
              setNotes={setCustomerNotes}
              totalValue={totalValue}
              totalItems={totalItems}
              giftWrap={giftWrap}
              packagesCount={packages.length}
              onBack={() => setView(giftWrap ? "packages" : "giftwrap")}
              onConfirm={confirmReservation}
              loading={confirmLoading}
            />
          )}

          {view === "confirmation" && lastReservation && (
            <ConfirmationScreen
              reservation={lastReservation}
              onHome={resetFlow}
            />
          )}

          {/* FLUXO DO ADMINISTRADOR */}
          {view === "adminLogin" && !session && (
            <AdminLoginScreen
              onSuccess={(userSession) => {
                setSession(userSession);
                localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(userSession));
                setView("admin");
                addToast("Login realizado com sucesso!", "success");
              }}
              onBack={() => setView("home")}
              onUseDemo={() => {
                const demoSession = {
                  access_token: "demo_token_" + Date.now(),
                  user: { email: "admin@casavellumine.com" },
                  expires_at: Math.floor(Date.now() / 1000) + 86400,
                };
                setSession(demoSession);
                localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(demoSession));
                setView("admin");
                addToast("Conectado no Modo Administrador Demo!", "info");
              }}
            />
          )}

          {view === "admin" && session && (
            <AdminPanel
              session={session}
              adminTab={adminTab}
              setAdminTab={setAdminTab}
              products={products}
              categories={categories}
              reservations={reservations}
              reservationsLoading={reservationsLoading}
              uniqueCustomerCount={uniqueCustomerCount}
              totalItemsReservedCount={totalItemsReservedCount}
              totalRevenueReserved={totalRevenueReserved}
              itemAggregation={itemAggregation}
              statusFilter={statusFilter}
              setStatusFilter={setStatusFilter}
              adminSearch={adminSearch}
              setAdminSearch={setAdminSearch}
              onUpdateStatus={handleUpdateReservationStatus}
              onDeleteProduct={handleDeleteProduct}
              onToggleProductActive={handleToggleProductActive}
              onStartNewProduct={() => {
                setEditingProduct(null);
                setProductDraft({
                  name: "",
                  category: categories[0] || "Vela Aromática",
                  aroma: "",
                  size: "",
                  usage: "",
                  price: "",
                  active: true,
                  photos: [],
                  mainPhoto: 0,
                });
                setAdminTab("productForm");
              }}
              onEditProduct={(p) => {
                setEditingProduct(p);
                setProductDraft({ ...p, price: String(p.price) });
                setAdminTab("productForm");
              }}
              productDraft={productDraft}
              setProductDraft={setProductDraft}
              photoUrlInput={photoUrlInput}
              setPhotoUrlInput={setPhotoUrlInput}
              newCategoryInput={newCategoryInput}
              setNewCategoryInput={setNewCategoryInput}
              onAddCategory={handleAddCategory}
              onSaveProduct={handleSaveProduct}
              onCancelProductForm={() => setAdminTab("products")}
              onExportCSV={exportToCSV}
              onRefreshReservations={loadReservations}
              onLogout={() => {
                setSession(null);
                localStorage.removeItem(STORAGE_KEYS.SESSION);
                setView("home");
                addToast("Sessão encerrada.", "info");
              }}
              onBackHome={() => setView("home")}
              isUsingLocalData={isUsingLocalData}
              setIsUsingLocalData={setIsUsingLocalData}
              addToast={addToast}
            />
          )}
        </div>
      );
    }

    /* ==========================================================================
       GALERIA DE FOTOS INTERATIVA DO PRODUTO
    ========================================================================== */
    function ProductImageGallery({ photos, name }) {
      const [curr, setCurr] = useState(0);
      const list = photos && photos.length > 0 ? photos : [];

      if (list.length === 0) {
        return (
          <div className="w-full aspect-square bg-brand-surface2 flex items-center justify-center text-brand-muted">
            <Icon name="package" size={36} />
          </div>
        );
      }

      return (
        <div className="relative w-full aspect-square bg-brand-surface2 overflow-hidden group">
          <img
            src={list[curr]}
            alt={name}
            className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
            loading="lazy"
          />

          {list.length > 1 && (
            <>
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  setCurr((c) => (c - 1 + list.length) % list.length);
                }}
                className="absolute left-2.5 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black/80 text-white p-1.5 rounded-full backdrop-blur transition-opacity opacity-80 hover:opacity-100"
                aria-label="Foto anterior"
              >
                <Icon name="chevronLeft" size={16} />
              </button>
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  setCurr((c) => (c + 1) % list.length);
                }}
                className="absolute right-2.5 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black/80 text-white p-1.5 rounded-full backdrop-blur transition-opacity opacity-80 hover:opacity-100"
                aria-label="Próxima foto"

    /* ==========================================================================
       TELA DE CONFIRMAÇÃO COM DISPARO PARA WHATSAPP
    ========================================================================== */
    function ConfirmationScreen({ reservation, onHome }) {
      // Gera texto pré-formatado para o WhatsApp da loja
      const generateWhatsAppUrl = () => {
        let text = `🕯️ *NOVA RESERVA — CASA VELLUMINE*\n`;
        text += `Código: #${reservation.id.slice(-6).toUpperCase()}\n`;
        text += `Cliente: *${reservation.name}*\n`;
        text += `WhatsApp: ${reservation.whatsapp}\n\n`;
        text += `*ITENS RESERVADOS:*\n`;
        reservation.items.forEach((it) => {
          text += `• ${it.qty}x ${it.name} ${it.size ? `(${it.size})` : ""} — ${formatBRL(it.qty * it.price)}\n`;
        });
        text += `\n*Total:* ${formatBRL(reservation.total)}\n`;
        text += `*Embalagem para presente:* ${reservation.giftWrap ? "Sim" : "Não"}\n`;

        if (reservation.giftWrap && reservation.packages.length > 0) {
          text += `\n*Organização das Caixas:*\n`;
          reservation.packages.forEach((pkg, idx) => {
            text += `  Caixa ${idx + 1}: ` + pkg.items.map((i) => `${i.qty}x ${i.name}`).join(", ") + `\n`;
          });
        }

        if (reservation.notes) {
          text += `\n*Observações:* ${reservation.notes}\n`;
        }
        text += `\nOlá! Acabei de fazer essa reserva no site e gostaria de confirmar a retirada.`;

        return `https://wa.me/${WHATSAPP_STORE_PHONE}?text=${encodeURIComponent(text)}`;
      };

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
          <div className="max-w-md w-full bg-brand-surface border border-brand-border rounded-xl p-8 shadow-2xl">
            <div className="w-16 h-16 bg-brand-accent/20 border border-brand-accent text-brand-accent rounded-full flex items-center justify-center mx-auto mb-5">
              <Icon name="check" size={32} />
            </div>

            <span className="text-xs uppercase tracking-widest text-brand-accent font-semibold block mb-1">
              Reserva Registrada
            </span>
            <h2 className="font-serif text-3xl text-brand-text mb-2">Muito Obrigado!</h2>
            <p className="text-sm text-brand-textMuted mb-6 leading-relaxed">
              Sua reserva foi registrada para <strong>{reservation.name}</strong>.
            </p>

            {/* Código da Reserva */}
            <div className="bg-brand-surface2 border border-brand-border rounded p-3 mb-6 flex justify-between items-center text-sm">
              <span className="text-brand-textMuted">Código da Reserva:</span>
              <span className="font-mono font-bold text-brand-accent">
                #{reservation.id.slice(-6).toUpperCase()}
              </span>
            </div>

            {/* Detalhes dos Itens */}
            <div className="text-left divide-y divide-brand-border/60 border-y border-brand-border/60 mb-6 text-xs sm:text-sm">
              {reservation.items.map((it, idx) => (
                <div key={idx} className="py-2.5 flex justify-between">
                  <span className="text-brand-text">
                    {it.qty}x {it.name}
                  </span>
                  <span className="text-brand-textMuted font-medium">
                    {formatBRL(it.qty * it.price)}
                  </span>
                </div>
              ))}
              <div className="py-3 flex justify-between font-bold text-brand-text text-base">
                <span>Total</span>
                <span className="text-brand-accent font-serif">{formatBRL(reservation.total)}</span>
              </div>
            </div>

            {/* Botão de Envio para WhatsApp da Loja */}
            <a
              href={generateWhatsAppUrl()}
              target="_blank"
              rel="noopener noreferrer"
              className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded text-sm transition-all shadow-lg flex items-center justify-center gap-2 mb-3"

    /* ==========================================================================
       TELA DE LOGIN DO ADMINISTRADOR
    ========================================================================== */
    function AdminLoginScreen({ onSuccess, onBack, onUseDemo }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const handleLogin = async (e) => {
        e.preventDefault();
        setError("");
        setLoading(true);
        try {
          const data = await supabaseSignIn(email.trim(), password);
          onSuccess({
            access_token: data.access_token,
            refresh_token: data.refresh_token,
            expires_at: data.expires_at,
            user: data.user,
          });
        } catch (err) {
          setError(err.message || "E-mail ou senha incorretos.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6">
          <div className="max-w-sm w-full bg-brand-surface border border-brand-border rounded-xl p-8 shadow-2xl">
            <div className="text-center mb-6">
              <div className="w-12 h-12 bg-brand-surface2 border border-brand-border rounded-full flex items-center justify-center mx-auto mb-3 text-brand-accent">
                <Icon name="lock" size={22} />
              </div>
              <h2 className="font-serif text-2xl text-brand-text">Acesso do Lojista</h2>
              <p className="text-xs text-brand-textMuted mt-1">
                Autenticação via Supabase Auth
              </p>
            </div>

            {error && (
              <div className="bg-red-950/60 border border-red-800 text-red-200 text-xs p-3 rounded mb-4 text-center">
                {error}
              </div>
            )}

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs uppercase tracking-wider text-brand-textMuted mb-1">
                  E-mail
                </label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="admin@casavellumine.com"
                  className="w-full bg-brand-surface2 border border-brand-border rounded px-3.5 py-2.5 text-sm text-brand-text focus:border-brand-accent outline-none"
                  required
                />
              </div>

              <div>
                <label className="block text-xs uppercase tracking-wider text-brand-textMuted mb-1">
                  Senha
                </label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full bg-brand-surface2 border border-brand-border rounded px-3.5 py-2.5 text-sm text-brand-text focus:border-brand-accent outline-none"
                  required
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full bg-brand-accent hover:bg-brand-accentHover text-brand-onAccent font-semibold py-3 rounded text-sm transition-all"
              >
                {loading ? "Entrando..." : "Entrar com Supabase"}
              </button>
            </form>

            <div className="relative my-6 text-center">
              <div className="absolute inset-0 flex items-center">
                <div className="w-full border-t border-brand-border"></div>
              </div>
              <span className="relative bg-brand-surface px-3 text-[11px] uppercase tracking-wider text-brand-muted">
                Ou acesse sem banco
              </span>
            </div>

            <button
              onClick={onUseDemo}
              className="w-full bg-brand-surface2 hover:bg-brand-surface2/80 border border-brand-accent/40 text-brand-accent py-2.5 rounded text-xs font-semibold transition-colors"

                    <div>
                      <label className="block text-xs uppercase tracking-wider text-brand-textMuted mb-1">
                        Nome do Produto *
                      </label>
                      <input
                        type="text"
                        value={productDraft.name}
                        onChange={(e) =>
                          setProductDraft({ ...productDraft, name: e.target.value })
                        }
                        placeholder="Ex: Vela Vanilla & Figo"
                        className="w-full bg-brand-surface2 border border-brand-border rounded px-3.5 py-2 text-sm text-brand-text focus:border-brand-accent outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs uppercase tracking-wider text-brand-textMuted mb-1">
                        Preço (R$) *
                      </label>
                      <input
                        type="text"
                        value={productDraft.price}
                        onChange={(e) =>
                          setProductDraft({ ...productDraft, price: e.target.value })
                        }
                        placeholder="89.90"
                        className="w-full bg-brand-surface2 border border-brand-border rounded px-3.5 py-2 text-sm text-brand-text focus:border-brand-accent outline-none"
                      />
                    </div>
                  </div>

                  {/* Categoria */}
                  <div>
                    <label className="block text-xs uppercase tracking-wider text-brand-textMuted mb-1">
                      Categoria
                    </label>
                    <div className="flex gap-2">
                      <select
                        value={productDraft.category}
                        onChange={(e) =>
                          setProductDraft({ ...productDraft, category: e.target.value })
                        }
                        className="flex-1 bg-brand-surface2 border border-brand-border rounded px-3.5 py-2 text-sm text-brand-text focus:border-brand-accent outline-none"
                      >
                        {categories.map((c) => (
                          <option key={c} value={c}>
                            {c}
                          </option>
                        ))}
                      </select>
                    </div>
                    {/* Criar nova categoria */}
                    <div className="flex gap-2 mt-2">
                      <input
                        type="text"
                        value={newCategoryInput}
                        onChange={(e) => setNewCategoryInput(e.target.value)}
                        placeholder="Adicionar nova categoria..."
                        className="flex-1 bg-brand-surface2 border border-brand-border rounded px-3 py-1.5 text-xs text-brand-text focus:border-brand-accent outline-none"
                      />
                      <button
                        onClick={onAddCategory}
                        className="text-xs px-3 py-1.5 bg-brand-surface2 border border-brand-border hover:border-brand-accent text-brand-accent rounded"
                      >
                        + Adicionar
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs uppercase tracking-wider text-brand-textMuted mb-1">
                        Família Olfativa / Aroma
                      </label>
                      <input
                        type="text"
                        value={productDraft.aroma}
                        onChange={(e) =>
                          setProductDraft({ ...productDraft, aroma: e.target.value })
                        }
                        placeholder="Baunilha Bourbon e Âmbar"
                        className="w-full bg-brand-surface2 border border-brand-border rounded px-3.5 py-2 text-sm text-brand-text focus:border-brand-accent outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs uppercase tracking-wider text-brand-textMuted mb-1">
                        Tamanho / Especificação
                      </label>
                      <input
                        type="text"
                        value={productDraft.size}
                        onChange={(e) =>
                          setProductDraft({ ...productDraft, size: e.target.value })
                        }
                        placeholder="210g (~40h de queima)"
                        className="w-full bg-brand-surface2 border border-brand-border rounded px-3.5 py-2 text-sm text-brand-text focus:border-brand-accent outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs uppercase tracking-wider text-brand-textMuted mb-1">
                      Recomendações de Uso
                    </label>
                    <textarea
                      value={productDraft.usage}
                      onChange={(e) =>
                        setProductDraft({ ...productDraft, usage: e.target.value })
                      }
                      rows="2"
                      placeholder="Apare o pavio antes de reacender..."
                      className="w-full bg-brand-surface2 border border-brand-border rounded px-3.5 py-2 text-sm text-brand-text focus:border-brand-accent outline-none resize-none"
                    />
                  </div>

                  {/* Gerenciamento de Fotos */}
                  <div>
                    <label className="block text-xs uppercase tracking-wider text-brand-textMuted mb-1">
                      Fotos do Produto
                    </label>
                    <div className="flex gap-2 mb-3">
                      <input
                        type="text"
                        value={photoUrlInput}
                        onChange={(e) => setPhotoUrlInput(e.target.value)}
                        placeholder="Cole o link (URL) da imagem..."
                        className="flex-1 bg-brand-surface2 border border-brand-border rounded px-3 py-1.5 text-xs text-brand-text focus:border-brand-accent outline-none"
                      />
                      <button
                        onClick={() => {
                          if (photoUrlInput.trim()) {
                            setProductDraft((d) => ({
                              ...d,
                              photos: [...d.photos, photoUrlInput.trim()],
                            }));
                            setPhotoUrlInput("");
                          }
                        }}
                        className="text-xs px-3 py-1.5 bg-brand-surface2 border border-brand-border text-brand-text rounded hover:border-brand-accent"
                      >
                        Adicionar Link
                      </button>
                    </div>

                    {/* Upload de arquivo local (converte para Base64) */}
                    <div className="mb-3">
                      <label className="inline-flex items-center gap-2 text-xs bg-brand-surface2 border border-brand-border hover:border-brand-accent text-brand-text px-3 py-1.5 rounded cursor-pointer">
                        <Icon name="plus" size={14} />
                        <span>Carregar foto do computador</span>
                        <input
                          type="file"
                          accept="image/*"
                          className="hidden"
                          onChange={(e) => {
                            const file = e.target.files && e.target.files[0];
                            if (file) {
                              const reader = new FileReader();
                              reader.onload = () => {
                                setProductDraft((d) => ({
                                  ...d,
                                  photos: [...d.photos, reader.result],
                                }));
                              };
                              reader.readAsDataURL(file);
                            }
                          }}
                        />
                      </label>
                    </div>

                    {/* Miniaturas de Fotos */}
                    <div className="flex flex-wrap gap-3">
                      {productDraft.photos.map((url, idx) => (
                        <div
                          key={idx}
                          className="relative w-16 h-16 rounded overflow-hidden border border-brand-border group"
                        >
                          <img src={url} alt="" className="w-full h-full object-cover" />
                          <button
                            onClick={() =>
                              setProductDraft((d) => ({ ...d, mainPhoto: idx }))
                            }
                            className={`absolute bottom-1 left-1 p-1 rounded-full ${
                              productDraft.mainPhoto === idx
                                ? "bg-brand-accent text-brand-onAccent"
                                : "bg-black/60 text-white"
                            }`}
                            title="Marcar como foto principal"
                          >
                            <Icon name="star" size={10} />
                          </button>
                          <button
                            onClick={() =>
                              setProductDraft((d) => ({
                                ...d,
                                photos: d.photos.filter((_, i) => i !== idx),
                                mainPhoto: d.mainPhoto >= idx ? Math.max(0, d.mainPhoto - 1) : d.mainPhoto,
                              }))
                            }
                            className="absolute top-1 right-1 p-1 bg-black/60 text-white hover:text-red-400 rounded-full"
                            title="Remover foto"
                          >
                            <Icon name="x" size={10} />
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex gap-3 justify-end mt-8 pt-4 border-t border-brand-border">
                  <button
                    onClick={onCancelProductForm}
                    className="px-5 py-2.5 border border-brand-border text-brand-text rounded text-xs hover:bg-brand-surface2"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={onSaveProduct}
                    className="px-6 py-2.5 bg-brand-accent hover:bg-brand-accentHover text-brand-onAccent font-semibold rounded text-xs"
                  >
                    Salvar Produto
                  </button>
                </div>
              </div>
            )}

            {/* 3. ABA RESERVAS POR CLIENTE */}
            {adminTab === "reservations" && (
              <div className="space-y-6 animate-fade-in">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div>
                    <h2 className="font-serif text-2xl text-brand-text">
                      Reservas por Cliente
                    </h2>
                    <p className="text-xs text-brand-textMuted">
                      {filteredReservations.length} reservas listadas
                    </p>
                  </div>

                  {/* Filtro por status */}
                  <div className="flex gap-1.5 overflow-x-auto w-full sm:w-auto">
                    {["todos", "pendente", "confirmada", "pronta", "concluida", "cancelada"].map(
                      (st) => (
                        <button
                          key={st}
                          onClick={() => setStatusFilter(st)}
                          className={`px-3 py-1 rounded text-xs capitalize whitespace-nowrap border ${
                            statusFilter === st
                              ? "bg-brand-accent text-brand-onAccent border-brand-accent font-semibold"
                              : "border-brand-border text-brand-textMuted hover:border-brand-muted"
                          }`}
                        >
                          {st}
                        </button>
                      )
                    )}
                  </div>
                </div>

                {/* Campo de Busca Rápida */}
                <input
                  type="text"
                  value={adminSearch}
                  onChange={(e) => setAdminSearch(e.target.value)}
                  placeholder="Buscar por nome do cliente ou WhatsApp..."
                  className="w-full bg-brand-surface border border-brand-border rounded px-4 py-2.5 text-sm text-brand-text focus:border-brand-accent outline-none"
                />

                {filteredReservations.length === 0 ? (
                  <div className="text-center py-16 bg-brand-surface border border-brand-border rounded-lg text-brand-muted">
                    Nenhuma reserva encontrada com os filtros atuais.
                  </div>
                ) : (
                  <div className="space-y-4">
                    {filteredReservations.map((r) => {
                      const cleanPhone = r.whatsapp.replace(/\D/g, "");
                      const clientWaUrl = `https://wa.me/55${cleanPhone}?text=${encodeURIComponent(
                        `Olá ${r.name}, tudo bem? Aqui é da Casa Vellumine sobre a sua reserva #${r.id.slice(-6).toUpperCase()}!`
                      )}`;

                      return (
                        <div
                          key={r.id}
                          className="bg-brand-surface border border-brand-border rounded-lg p-5 space-y-4"
                        >
                          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 pb-3 border-b border-brand-border/60">
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="font-serif text-lg font-semibold text-brand-text">
                                  {r.name}
                                </span>
                                <span className="font-mono text-xs text-brand-muted">
                                  #{r.id.slice(-6).toUpperCase()}
                                </span>
                              </div>
                              <div className="text-xs text-brand-textMuted flex items-center gap-2 mt-0.5">
                                <span>{r.whatsapp}</span>
                                <span>·</span>
                                <span>{new Date(r.createdAt).toLocaleString("pt-BR")}</span>
                              </div>
                            </div>

                            {/* Controles de Status e WhatsApp */}
                            <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                              <select
                                value={r.status}
                                onChange={(e) => onUpdateStatus(r.id, e.target.value)}
                                className={`text-xs font-semibold px-3 py-1.5 rounded border outline-none cursor-pointer ${
                                  r.status === "concluida"
                                    ? "bg-emerald-950 border-emerald-800 text-emerald-300"
                                    : r.status === "pronta"
                                    ? "bg-sky-950 border-sky-800 text-sky-300"
                                    : r.status === "cancelada"
                                    ? "bg-red-950 border-red-800 text-red-300"
                                    : "bg-amber-950 border-amber-800 text-amber-300"
                                }`}
                              >
                                <option value="pendente">Pendente</option>
                                <option value="confirmada">Confirmada</option>
                                <option value="pronta">Pronta para Retirada</option>
                                <option value="concluida">Concluída</option>
                                <option value="cancelada">Cancelada</option>
                              </select>

                              <a
                                href={clientWaUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3 py-1.5 rounded flex items-center gap-1.5 transition-colors"
                              >
                                <Icon name="phone" size={13} />
                                <span>WhatsApp</span>
                              </a>
                            </div>
                          </div>

                          {/* Itens da Reserva */}
                          <div className="text-sm space-y-1">
                            {r.items.map((it, idx) => (
                              <div key={idx} className="flex justify-between text-xs sm:text-sm">
                                <span className="text-brand-text">
                                  {it.qty}x {it.name} {it.size ? `(${it.size})` : ""}
                                </span>
                                <span className="text-brand-textMuted">
                                  {formatBRL(it.qty * it.price)}
                                </span>
                              </div>
                            ))}
                            <div className="pt-2 flex justify-between font-semibold text-brand-text text-sm border-t border-brand-border/40">
                              <span>Total da Reserva:</span>
                              <span className="font-serif text-brand-accent">
                                {formatBRL(r.total)}
                              </span>
                            </div>
                          </div>

                          {/* Embalagens */}
                          {r.giftWrap && r.packages.length > 0 && (
                            <div className="bg-brand-surface2/60 border border-brand-border/60 rounded p-3 text-xs space-y-2">
                              <span className="font-medium text-brand-accent flex items-center gap-1">
                                <Icon name="gift" size={13} />
                                Caixas de Presente:
                              </span>
                              {r.packages.map((pkg, idx) => (
                                <div key={pkg.id || idx} className="text-brand-textMuted pl-2">
                                  <strong>Caixa {idx + 1}:</strong>{" "}
                                  {pkg.items.map((i) => `${i.qty}x ${i.name}`).join(", ")}
                                </div>
                              ))}
                            </div>
                          )}

                          {r.notes && (
                            <div className="text-xs text-brand-muted bg-brand-surface2/40 p-2.5 rounded border border-brand-border/40">
                              <strong>Obs:</strong> {r.notes}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* 4. ABA SEPARAÇÃO POR ITEM (PRODUÇÃO) */}
            {adminTab === "items" && (
              <div className="space-y-6 animate-fade-in">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="font-serif text-2xl text-brand-text">
                      Separação e Produção por Item
                    </h2>
                    <p className="text-xs text-brand-textMuted">
                      Soma consolidada de todos os produtos pedidos em reservas ativas
                    </p>
                  </div>
                </div>

                {itemAggregation.length === 0 ? (
                  <div className="text-center py-16 bg-brand-surface border border-brand-border rounded-lg text-brand-muted">
                    Nenhum item para separar no momento.
                  </div>
                ) : (
                  <div className="bg-brand-surface border border-brand-border rounded-lg overflow-hidden divide-y divide-brand-border/60">
                    {itemAggregation.map((it, idx) => (
                      <div
                        key={idx}
                        className="p-4 flex items-center justify-between hover:bg-brand-surface2/40 transition-colors"
                      >
                        <div>
                          <h4 className="font-serif text-base font-medium text-brand-text">
                            {it.name}
                          </h4>
                          <span className="text-xs text-brand-textMuted">
                            {it.aroma} {it.size ? `· ${it.size}` : ""}
                          </span>
                        </div>
                        <div className="text-right">
                          <span className="font-serif text-xl font-bold text-brand-accent block">
                            {it.qty} {it.qty === 1 ? "peça" : "peças"}
                          </span>
                          <span className="text-xs text-brand-muted">
                            Total reservado: {formatBRL(it.total)}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* 5. ABA CONFIGURAÇÕES & SUPABASE */}
            {adminTab === "settings" && (
              <div className="max-w-xl mx-auto bg-brand-surface border border-brand-border rounded-lg p-6 sm:p-8 space-y-6 animate-fade-in">
                <div>
                  <h3 className="font-serif text-2xl text-brand-text">
                    Configurações do Supabase
                  </h3>
                  <p className="text-xs text-brand-textMuted mt-1">
                    Conecte seu projeto do Supabase para persistir produtos e reservas na nuvem.
                  </p>
                </div>

                {/* Alternador de Modo */}
                <div className="bg-brand-surface2 border border-brand-border rounded p-4 flex items-center justify-between">
                  <div>
                    <span className="text-sm font-semibold text-brand-text block">
                      Modo Local (Offline / Demo)
                    </span>
                    <span className="text-xs text-brand-textMuted">
                      Salva catálogo e pedidos no armazenamento deste navegador sem exigir banco de dados.
                    </span>
                  </div>
                  <input
                    type="checkbox"
                    checked={isUsingLocalData}
                    onChange={(e) => {
                      setIsUsingLocalData(e.target.checked);
                      localStorage.setItem(
                        STORAGE_KEYS.USE_LOCAL,
                        e.target.checked ? "true" : "false"
                      );
                      addToast(
                        e.target.checked ? "Modo Local ativado." : "Modo Supabase ativado.",
                        "info"
                      );
                    }}
                    className="w-5 h-5 accent-brand-accent cursor-pointer"
                  />
                </div>

                <form onSubmit={handleSaveConfig} className="space-y-4">
                  <div>
                    <label className="block text-xs uppercase tracking-wider text-brand-textMuted mb-1">
                      Supabase Project URL
                    </label>
                    <input
                      type="url"
                      value={configUrl}
                      onChange={(e) => setConfigUrl(e.target.value)}
                      placeholder="https://seu-projeto.supabase.co"
                      className="w-full bg-brand-surface2 border border-brand-border rounded px-3.5 py-2 text-sm text-brand-text focus:border-brand-accent outline-none font-mono"
                    />
                  </div>

                  <div>
                    <label className="block text-xs uppercase tracking-wider text-brand-textMuted mb-1">
                      Supabase Anon / Publishable Key
                    </label>
                    <input
                      type="text"
                      value={configKey}
                      onChange={(e) => setConfigKey(e.target.value)}
                      placeholder="sb_publishable_..."
                      className="w-full bg-brand-surface2 border border-brand-border rounded px-3.5 py-2 text-sm text-brand-text focus:border-brand-accent outline-none font-mono text-xs"
                    />
                  </div>

                  <div className="pt-2 flex gap-3">
                    <button
                      type="submit"
                      className="flex-1 bg-brand-accent hover:bg-brand-accentHover text-brand-onAccent font-semibold py-2.5 rounded text-xs transition-colors"
                    >
                      Salvar Conexão
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setConfigUrl(DEFAULT_SUPABASE_URL);
                        setConfigKey(DEFAULT_SUPABASE_KEY);
                        addToast("Valores restaurados para o padrão.", "info");
                      }}
                      className="px-4 py-2.5 border border-brand-border text-brand-textMuted hover:text-white rounded text-xs"
                    >
                      Restaurar Padrão
                    </button>
                  </div>
                </form>

                {/* Reset de Dados Locais */}
                <div className="pt-6 border-t border-brand-border/60">
                  <span className="text-xs uppercase tracking-wider text-brand-muted block mb-2 font-medium">
                    Manutenção Local
                  </span>
                  <button
                    type="button"
                    onClick={() => {
                      if (confirm("Deseja recarregar o catálogo padrão de demonstração?")) {
                        localStorage.removeItem(STORAGE_KEYS.PRODUCTS);
                        localStorage.removeItem(STORAGE_KEYS.CATEGORIES);
                        location.reload();
                      }
                    }}
                    className="text-xs text-brand-muted hover:text-red-400 underline"
                  >
                    Restaurar catálogo inicial de demonstração
                  </button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    // Renderiza a Aplicação
    ReactDOM.createRoot(document.getElementById("root")).render(<CasaVellumineApp />);
  </script>
</body>
</html>
